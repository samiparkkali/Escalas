[tool.pytest.ini_options]
testpaths = ["tests"]
# anyio's plugin is unused here and warns under pytest 9.
addopts = "-p no:anyio"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
# FastAPI declares dependencies with Depends() in argument defaults.
ignore = ["B008"]
